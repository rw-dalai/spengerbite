spring:
  application:
    name: spengerbite
  datasource:
    url: jdbc:h2:mem:spengerbite
  h2:
    console:
      enabled: true
  mvc:
    problemdetails:
      enabled: true # RFC 9457: Spring answers its own errors (e.g. @Valid) as application/problem+json
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
